<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aroosi No — دایرکتوری لوکس تامین‌کنندگان عروسی استان یزد</title>

  <!-- Vazirmatn Persian Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Scoped Styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="directory.css">
</head>
<body class="bg-[#07090E] text-[#F7F5F0] font-['Vazirmatn'] antialiased min-h-screen flex flex-col">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-50 bg-[#0b0f19]/90 backdrop-blur-xl border-b border-[#D4AF37]/35 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <!-- Right: Brand Logo & Back to Home -->
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-[#D4AF37] to-[#8C6D23] flex items-center justify-center text-[#0F251A] font-black shadow-lg">
            👑
          </div>
          <div class="text-right">
            <span class="text-sm font-black text-white block">عروسی نو</span>
            <span class="text-[9px] text-[#D4AF37] font-bold block">Aroosi No Luxury Directory</span>
          </div>
        </a>
      </div>

      <!-- Left: Navigation Links -->
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-bold text-slate-300 hover:text-[#D4AF37] transition-colors">بازگشت به صفحه اصلی ➔</a>
      </div>
    </div>
  </header>

  <!-- MAIN DIRECTORY CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <div id="tab-directory" class="tab-content space-y-8">

      <!-- STICKY TOP GLASS FILTER BAR -->
      <div id="directory-primary-filter-island" class="bg-[#0e121c]/90 backdrop-blur-xl border border-[#C5A059]/40 rounded-3xl p-4 sm:p-5 shadow-2xl text-white space-y-4">
        <!-- Filter Header & Search Bar -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4">
          <div class="space-y-1 text-right w-full md:w-auto">
            <span class="text-[11px] font-black text-[#D4AF37] block">💎 دایرکتوری برندهای تاییدشده یزد</span>
            <h1 class="text-lg sm:text-xl font-black text-[#F7F5F0]">جستجو و رزرو تامین‌کنندگان لوکس عروسی</h1>
          </div>

          <!-- Quick Instant Search Input -->
          <div class="relative w-full md:w-80">
            <input id="directory-instant-search" type="text" oninput="filterVendors()" placeholder="جستجوی نام تالار، آتلیه، مزون..." class="w-full bg-[#141A28] border border-[#C5A059]/30 rounded-2xl pr-9 pl-4 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-[#D4AF37]">
            <i data-lucide="search" class="w-4 h-4 text-[#D4AF37] absolute right-3 top-2.5"></i>
          </div>
        </div>

        <!-- CATEGORY PILLS BAR -->
        <div class="space-y-2 pt-2 border-t border-[#C5A059]/20">
          <span class="text-[10.5px] font-bold text-slate-300 block">دسته‌بندی خدمات:</span>
          <div id="directory-category-carousel" class="flex items-center gap-2 overflow-x-auto no-scrollbar text-xs font-black">
            <button type="button" onclick="filterVendorsByCategoryTitle('all')" class="bg-[#D4AF37] text-[#0F251A] px-3.5 py-1.5 rounded-xl shrink-0 cursor-pointer shadow-md font-bold">
              همه خدمات
            </button>
            <button type="button" onclick="filterVendorsByCategoryTitle('تالار و باغ تالار عروسی')" class="bg-[#141A28] hover:bg-[#1E293B] text-amber-200 border border-[#C5A059]/30 px-3.5 py-1.5 rounded-xl shrink-0 cursor-pointer transition-all">
              🏛️ تالار و باغ تالار
            </button>
            <button type="button" onclick="filterVendorsByCategoryTitle('آتلیه عکاسی و فیلمبرداری')" class="bg-[#141A28] hover:bg-[#1E293B] text-amber-200 border border-[#C5A059]/30 px-3.5 py-1.5 rounded-xl shrink-0 cursor-pointer transition-all">
              📸 آتلیه عکاسی
            </button>
            <button type="button" onclick="filterVendorsByCategoryTitle('مزون لباس عروس و داماد')" class="bg-[#141A28] hover:bg-[#1E293B] text-amber-200 border border-[#C5A059]/30 px-3.5 py-1.5 rounded-xl shrink-0 cursor-pointer transition-all">
              👗 مزون عروس
            </button>
            <button type="button" onclick="filterVendorsByCategoryTitle('سالن زیبایی و میکاپ عروس')" class="bg-[#141A28] hover:bg-[#1E293B] text-amber-200 border border-[#C5A059]/30 px-3.5 py-1.5 rounded-xl shrink-0 cursor-pointer transition-all">
              💄 سالن زیبایی
            </button>
            <button type="button" onclick="filterVendorsByCategoryTitle('تشریفات و خدمات مجالس')" class="bg-[#141A28] hover:bg-[#1E293B] text-amber-200 border border-[#C5A059]/30 px-3.5 py-1.5 rounded-xl shrink-0 cursor-pointer transition-all">
              🌸 گل‌آرایی & تشریفات
            </button>
            <button type="button" onclick="filterVendorsByCategoryTitle('کیک و شیرینی عروسی')" class="bg-[#141A28] hover:bg-[#1E293B] text-amber-200 border border-[#C5A059]/30 px-3.5 py-1.5 rounded-xl shrink-0 cursor-pointer transition-all">
              🎂 کیک & شیرینی
            </button>
          </div>
        </div>

        <!-- DISTRICT & PRICE TIER FILTER ROW -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3 pt-2 border-t border-[#C5A059]/20 items-center text-xs">
          <!-- Neighborhoods Dropdown -->
          <div class="lg:col-span-4">
            <select id="header-city-select" onchange="filterVendors()" class="w-full bg-[#141A28] border border-[#C5A059]/30 text-white rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:border-[#D4AF37] cursor-pointer">
              <option value="همه مناطق استان یزد">📍 تمامی مناطق یزد (صفائیه، تفت، جمهوری، ملاصدرا)</option>
              <option value="صفائیه، یزد">📍 صفائیه یزد</option>
              <option value="تفت، یزد">📍 تفت (باغ تالارهای خنک)</option>
              <option value="بلوار جمهوری، یزد">📍 بلوار جمهوری یزد</option>
              <option value="ملاصدرا، یزد">📍 خیابان ملاصدرا</option>
            </select>
          </div>

          <!-- Price Tiers -->
          <div class="lg:col-span-8 flex items-center gap-2 overflow-x-auto no-scrollbar">
            <span class="text-[10px] text-slate-300 font-bold shrink-0">سطح قیمت:</span>
            <button type="button" onclick="setPriceFilter('all')" class="bg-[#D4AF37]/20 text-[#D4AF37] border border-[#D4AF37]/40 px-3 py-1 rounded-lg shrink-0 font-bold">همه</button>
            <button type="button" onclick="setPriceFilter('economic')" class="bg-[#141A28] text-slate-200 border border-slate-700 px-3 py-1 rounded-lg shrink-0 hover:border-[#D4AF37]">اقتصادی</button>
            <button type="button" onclick="setPriceFilter('mid')" class="bg-[#141A28] text-slate-200 border border-slate-700 px-3 py-1 rounded-lg shrink-0 hover:border-[#D4AF37]">متوسط-اقتصادی</button>
            <button type="button" onclick="setPriceFilter('luxury')" class="bg-[#141A28] text-slate-200 border border-slate-700 px-3 py-1 rounded-lg shrink-0 hover:border-[#D4AF37]">لوکس</button>
            <button type="button" onclick="setPriceFilter('vip')" class="bg-[#141A28] text-amber-300 border border-[#D4AF37]/50 px-3 py-1 rounded-lg shrink-0 hover:border-[#D4AF37] font-bold">👑 ویژه VIP</button>
          </div>
        </div>
      </div>

      <!-- EDITORIAL BENTO GRID CONTAINER -->
      <div id="vendor-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Populated dynamically via JS renderVendors() -->
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-[#08140E] border-t border-[#D4AF37]/30 text-slate-300 py-8 text-xs font-bold text-center">
    <div class="max-w-7xl mx-auto px-4">
      <p>© ۱۴۰۳ پلتفرم تشریفات و دایرکتوری لوکس عروسی استان یزد (Aroosi No)</p>
    </div>
  </footer>

  <!-- App Script -->
  <script src="script.js"></script>
</body>
</html>
