  <div id="inquiry-modal" class="inquiry-modal booking-modal-container fixed inset-0 z-[9999999] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-[#0F172A]/95 text-white border border-[#D4AF37]/60 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-[0_20px_60px_rgba(0,0,0,0.6)] space-y-5 relative max-h-[90vh] overflow-y-auto custom-scrollbar">
      <button onclick="closeInquiryModal()" class="absolute top-5 left-5 text-slate-400 hover:text-white transition-colors cursor-pointer" title="بستن">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>

      <div class="border-b border-slate-700/80 pb-3 space-y-2">
        <div class="inline-flex items-center gap-1.5 bg-[#D4AF37]/20 border border-[#D4AF37]/50 text-[#D4AF37] text-xs font-bold px-3 py-1 rounded-full">
          <i data-lucide="message-square-quote" class="w-3.5 h-3.5 text-[#D4AF37]"></i>
          <span>استعلام قیمت آنلاین و صدور پیش‌فاکتور</span>
        </div>
        <h3 id="modal-vendor-name" class="text-xl font-black text-[#D4AF37]">درخواست استعلام قیمت از تامین‌کننده</h3>
      </div>

      <!-- STICKY STEP INDICATORS BAR -->
      <div id="inquiry-step-indicators" class="sticky top-0 z-20 bg-[#0F172A]/95 backdrop-blur-md border-b border-[#D4AF37]/30 py-3 px-2 -mx-6 sm:-mx-8 -mt-6 p-4 mb-2 shadow-lg flex items-center gap-2 border-t border-[#D4AF37]/20">
        <div id="inquiry-step-ind-1" onclick="switchInquiryStep(1)" class="flex-1 text-center py-2 rounded-xl bg-[#D4AF37] text-[#0F251A] font-black text-xs shadow-[0_0_12px_rgba(212,175,55,0.4)] cursor-pointer hover:opacity-90 transition-all">
          ۱. تاریخ و زمان
        </div>
        <div id="inquiry-step-ind-2" onclick="switchInquiryStep(2)" class="flex-1 text-center py-2 rounded-xl bg-[#1E293B] text-slate-300 font-bold text-xs border border-[#D4AF37]/30 cursor-pointer hover:opacity-90 transition-all opacity-80">
          ۲. جزئیات و خدمات
        </div>
        <div id="inquiry-step-ind-3" onclick="switchInquiryStep(3)" class="flex-1 text-center py-2 rounded-xl bg-[#1E293B] text-slate-300 font-bold text-xs border border-[#D4AF37]/30 cursor-pointer hover:opacity-90 transition-all opacity-80">
          ۳. ثبت و تماس
        </div>
      </div>

      <!-- DYNAMIC CONTEXT BANNER CARD -->
      <div id="inquiry-context-banner" class="hidden bg-[#1E293B] border border-[#D4AF37]/60 rounded-2xl p-3.5 shadow-md space-y-2">
        <div class="flex items-center justify-between gap-2">
          <span id="inquiry-context-badge" class="bg-[#0F172A] text-[#D4AF37] text-[10px] font-black px-2.5 py-0.5 rounded-full border border-[#D4AF37]/40 flex items-center gap-1">
            <i data-lucide="tag" class="w-3 h-3 text-[#D4AF37]"></i>
            <span id="inquiry-context-type-text">درخواست استعلام پکیج</span>
          </span>
          <span id="inquiry-context-price" class="text-xs font-black text-[#D4AF37]"></span>
        </div>
        <div class="flex items-center gap-3">
          <img id="inquiry-context-thumb" src="" alt="کاور" class="w-12 h-12 rounded-xl object-cover border border-[#D4AF37]/40 shrink-0 hidden">
          <div>
            <h4 id="inquiry-context-title" class="text-xs font-extrabold text-white leading-snug"></h4>
            <p id="inquiry-context-sub" class="text-[11px] text-slate-300 mt-0.5 font-medium"></p>
          </div>
        </div>
      </div>

      <form id="inquiry-form" onsubmit="handleInquirySubmit(event)" class="space-y-4 text-xs font-bold text-white">
        <input type="hidden" id="inquiry-vendor-id" value="">
        <input type="hidden" id="inquiry-item-type" value="عمومی">
        <input type="hidden" id="inquiry-item-id" value="">
        <input type="hidden" id="inquiry-item-title" value="">

        <!-- STEP 1: DATE, AVAILABILITY & GUEST COUNT -->
        <div id="inquiry-step-1" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label id="inquiry-date-label" class="block mb-1.5 text-slate-200">تاریخ تقریبی مراسم (شمسی) *</label>
              <input type="text" id="inquiry-date" oninput="checkInquiryDateAvailability()" value="۱۴۰۳/۰۶/۱۵" placeholder="مثلاً: ۱۴۰۳/۰۶/۱۵" class="inquiry-form-control w-full bg-[#1E293B] border border-[#D4AF37]/30 text-white placeholder-slate-400 rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-[#D4AF37]">
              <div id="inquiry-date-availability-badge" class="mt-1 text-[11px] font-bold p-2 rounded-xl flex items-center gap-1.5 hidden"></div>
            </div>

            <!-- Dynamic Guest Count / Package Specifics -->
            <div id="inquiry-guests-container">
              <label class="block mb-1.5 text-slate-200">تعداد تقریبی مهمانان *</label>
              <input type="number" id="inquiry-guests" value="250" min="1" max="2000" class="inquiry-form-control w-full bg-[#1E293B] border border-[#D4AF37]/30 text-white placeholder-slate-400 rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-[#D4AF37]">
            </div>

            <div id="inquiry-nonvenue-container" class="hidden">
              <label class="block mb-1.5 text-slate-200">نوع پکیج / نیاز اختصاصی *</label>
              <select id="inquiry-package-type" class="inquiry-form-control w-full bg-[#1E293B] border border-[#D4AF37]/30 text-white rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-[#D4AF37]">
                <option value="فرمالیته کویر یزد" class="bg-[#0F172A] text-white">پکیج اختصاصی فرمالیته کویر یزد</option>
                <option value="مراسم اصلی عروسی" class="bg-[#0F172A] text-white">خدمات کامل روز عروسی</option>
                <option value="پرو و مشاوره اختصاصی" class="bg-[#0F172A] text-white">مشاوره حضوری و تست پکیج</option>
              </select>
            </div>
          </div>
        </div>

        <!-- STEP 2: SERVICES CHECKLIST & CUSTOM QUESTIONS -->
        <div id="inquiry-step-2" class="space-y-4 hidden">
          <!-- Vendor Specific Custom Inquiry Questions Container -->
          <div id="inquiry-custom-fields-container" class="space-y-3 p-3.5 bg-[#1E293B] border border-[#D4AF37]/50 rounded-2xl hidden">
            <!-- Dynamically populated via JS -->
          </div>

          <!-- Service Checklist -->
          <div id="inquiry-services-container" class="space-y-2">
            <label class="block text-slate-200">انتخاب خدمات مورد نظر شما:</label>
            <div id="inquiry-services-checklist" class="grid grid-cols-1 sm:grid-cols-2 gap-2 p-3 bg-[#1E293B] border border-[#D4AF37]/30 rounded-2xl">
              <!-- Dynamically populated via JS -->
            </div>
          </div>

          <div>
            <label class="block mb-1.5 text-slate-200">توضیحات و یادداشت اختصاصی:</label>
            <input type="text" id="inquiry-note" value="سلام، درخواست استعلام قیمت و دریافت پیش‌فاکتور را دارم." class="inquiry-form-control w-full bg-[#1E293B] border border-[#D4AF37]/30 text-white placeholder-slate-400 rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-[#D4AF37]">
          </div>
        </div>

        <!-- STEP 3: CONTACT & BUDGET CONFIRMATION -->
        <div id="inquiry-step-3" class="space-y-4 hidden">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block mb-1.5 text-slate-200">نام و نام خانوادگی شما *</label>
              <input type="text" id="inquiry-name" value="علی و سارا" class="inquiry-form-control w-full bg-[#1E293B] border border-[#D4AF37]/30 text-white placeholder-slate-400 rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-[#D4AF37]">
            </div>

            <div>
              <label class="block mb-1.5 text-slate-200">شماره تماس (دریافت پیش‌فاکتور) *</label>
              <input type="tel" id="inquiry-phone" value="09121234567" placeholder="۰۹۱۲..." class="inquiry-form-control w-full bg-[#1E293B] border border-[#D4AF37]/30 text-white placeholder-slate-400 rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-[#D4AF37] dir-ltr">
            </div>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block mb-1.5 text-slate-200">محدوده بودجه مد نظر:</label>
              <select id="inquiry-budget-range" class="inquiry-form-control w-full bg-[#1E293B] border border-[#D4AF37]/30 text-white rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-[#D4AF37] cursor-pointer">
                <option value="۱۰ تا ۲۰ میلیون تومان" class="bg-[#0F172A] text-white">۱۰ تا ۲۰ میلیون تومان</option>
                <option value="۲۰ تا ۴۰ میلیون تومان" class="bg-[#0F172A] text-white">۲۰ تا ۴۰ میلیون تومان</option>
                <option value="۴۰ تا ۷۰ میلیون تومان" class="bg-[#0F172A] text-white">۴۰ تا ۷۰ میلیون تومان</option>
                <option value="۷۰ تا ۱۲۰ میلیون تومان" class="bg-[#0F172A] text-white" selected>۷۰ تا ۱۲۰ میلیون تومان</option>
                <option value="بالای ۱۲۰ میلیون تومان (VIP)" class="bg-[#0F172A] text-white">بالای ۱۲۰ میلیون تومان (VIP)</option>
                <option value="توافقی / استعلام متقابل" class="bg-[#0F172A] text-white">توافقی / استعلام متقابل</option>
              </select>
            </div>

          </div>

          <!-- Manual Budget Input & Quick Selector Pills -->
          <div class="p-3 bg-[#1E293B] border border-[#D4AF37]/30 rounded-2xl space-y-2">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-bold text-[#D4AF37]">مبلغ بودجه پیشنهادی یا حداکثر سقف پرداختی (تومان - اختیاری):</label>
              <span class="text-[11px] text-slate-300 font-normal">انتخاب سریع یا ورود دستی</span>
            </div>
            <div class="flex items-center gap-2">
              <input type="text" id="inquiry-budget-custom" placeholder="مثلاً: ۳۵,۰۰۰,۰۰۰ تومان" class="w-full bg-[#0F172A] border border-[#D4AF37]/30 rounded-xl p-2 text-xs font-bold text-white placeholder-slate-400 focus:outline-none focus:border-[#D4AF37]">
            </div>
            <div class="flex items-center gap-1.5 flex-wrap pt-1">
              <span class="text-[11px] text-slate-300">پیشنهاد سریع:</span>
              <button type="button" onclick="setInquiryBudgetPill('۱۰ تا ۲۰ میلیون تومان', '۱۵,۰۰۰,۰۰۰ تومان')" class="px-2.5 py-1 bg-[#0F172A] hover:bg-[#D4AF37]/20 border border-[#D4AF37]/30 rounded-lg text-[11px] text-amber-200 transition-all cursor-pointer">
                ۱۰ تا ۲۰ میلیون
              </button>
              <button type="button" onclick="setInquiryBudgetPill('۲۰ تا ۴۰ میلیون تومان', '۳۰,۰۰۰,۰۰۰ تومان')" class="px-2.5 py-1 bg-[#0F172A] hover:bg-[#D4AF37]/20 border border-[#D4AF37]/30 rounded-lg text-[11px] text-amber-200 transition-all cursor-pointer">
                ۲۰ تا ۴۰ میلیون
              </button>
              <button type="button" onclick="setInquiryBudgetPill('۴۰ تا ۷۰ میلیون تومان', '۵۰,۰۰۰,۰۰۰ تومان')" class="px-2.5 py-1 bg-[#0F172A] hover:bg-[#D4AF37]/20 border border-[#D4AF37]/30 rounded-lg text-[11px] text-amber-200 transition-all cursor-pointer">
